<!DOCTYPE html>
<head>
    <title>LOADING...</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100lvh;
            margin: 0;
            user-select: none;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .loader {
            height: 1.5em;
            width: 1.5em;
            border: 0.5em solid black;
            border-bottom-color: white;
            border-radius: 100%;
            animation: spin infinite 1s linear;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LOADING...</h1>
        <div class="loader"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./database.js"></script>
    <script>
        async function loadData() {
            localStorage.clear();

            const players = [];
            const npcs = [];
            const dados_p = await sbRead('personagens');

            dados_p.forEach(el => {
                if (el.tipo === 'player') {
                    players.push(JSON.stringify(el))
                } else if (el.tipo === 'npc') {
                    npcs.push(JSON.stringify(el))
                }
            });

            const marcadores = [];
            const dados_m = await sbRead('marcadores');

            dados_m.forEach(el => {
                const aux_el = {
                    name: el.name,
                    coords: [el.x, el.y],
                    description: el.description,
                    icon: el.icon
                };
                marcadores.push(JSON.stringify(aux_el));
            });

            const areas = [];
            const dados_a = await sbRead('areas');
            const dados_a_c = await sbRead('areas_coordenadas');

            dados_a.forEach(el => {
                const aux_coords = [];
                dados_a_c.forEach(e => {
                    if (e.area_id === el.id) {
                        aux_coords.push([e.x, e.y]);
                    }
                });

                const aux_el = {
                    name: el.name,
                    coords: aux_coords,
                    color: el.color,
                    description: el.description
                };
                areas.push(JSON.stringify(aux_el));
            });

            localStorage.setItem('players', '[' + players.toString() + ']');
            localStorage.setItem('npcs', '[' + npcs.toString() + ']');
            localStorage.setItem('marcadores', '[' + marcadores.toString() + ']');
            localStorage.setItem('areas', '[' + areas.toString() + ']');

            window.location.replace("./Wiki/index.html");
        }

        loadData();
    </script>
</body>
