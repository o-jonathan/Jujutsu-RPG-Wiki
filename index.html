<!DOCTYPE html>
<head>
    <title>LOADING...</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100lvh;
            margin: 0;
            user-select: none;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .loader {
            height: 1.5em;
            width: 1.5em;
            border: 0.5em solid black;
            border-bottom-color: white;
            border-radius: 100%;
            animation: spin infinite 1s linear;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LOADING...</h1>
        <div class="loader"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./database.js"></script>
    <script>
        async function loadData() {
            localStorage.clear();

            const players = JSON.stringify(await sbRead('personagens', 'player'));
            const npcs = JSON.stringify(await sbRead('personagens', 'npc'));

            localStorage.setItem('players', players);
            localStorage.setItem('npcs', npcs);

            window.location.replace("./Wiki/index.html");
        }

        loadData();
    </script>
</body>
